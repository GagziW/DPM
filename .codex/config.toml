[mcp_servers.firebase]
command = "bash"
args = [
    "-lc",
    'd="$PWD"; while [ "$d" != / ] && [ ! -f "$d/firebase.json" ]; do d=$(dirname "$d"); done; [ -f "$d/firebase.json" ] || d="$PWD"; exec npx -y firebase-tools@latest mcp --dir "$d"',
]
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.context7]
command = "npx"
args = [
    "-y",
    "@upstash/context7-mcp",
]

[mcp_servers.stripe]
url = "https://mcp.stripe.com"
